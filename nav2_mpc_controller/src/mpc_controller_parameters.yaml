# Parameters of the MPC controller plugin, declared under the plugin name prefix
# (e.g. "FollowPath.horizon"). The C++ struct and the validation are generated by
# generate_parameter_library; every parameter can be changed at runtime.
nav2_mpc_controller:
  solver:
    type: string
    default_value: "nmpc_sqp"
    description: "Control back-end: Kanayama baseline, LTV-MPC (linearized on the reference) or NMPC by SQP/RTI."
    validation:
      one_of<>: [["baseline", "ltv_mpc", "nmpc_sqp"]]
  horizon:
    type: int
    default_value: 20
    description: "Number of prediction steps N."
    validation:
      bounds<>: [2, 200]
  dt:
    type: double
    default_value: 0.1
    description: "Discretization step of the prediction model [s]."
    validation:
      gt<>: [0.0]
  desired_linear_vel:
    type: double
    default_value: 0.25
    description: "Cruise speed used to time-parametrize the path [m/s]."
    validation:
      gt<>: [0.0]
  path_search_distance:
    type: double
    default_value: 1.0
    description: "Arc length of the pruned plan searched for the robot projection [m]."
    validation:
      gt<>: [0.0]

  limits:
    v_min:
      type: double
      default_value: -0.05
      description: "Minimum linear velocity [m/s] (negative allows small reverse corrections)."
      validation:
        lt_eq<>: [0.0]
    v_max:
      type: double
      default_value: 0.26
      description: "Maximum linear velocity [m/s]."
      validation:
        gt<>: [0.0]
    w_max:
      type: double
      default_value: 1.8
      description: "Maximum angular velocity magnitude [rad/s]."
      validation:
        gt<>: [0.0]
    a_max:
      type: double
      default_value: 1.0
      description: "Maximum linear acceleration magnitude [m/s^2]."
      validation:
        gt<>: [0.0]
    alpha_max:
      type: double
      default_value: 3.0
      description: "Maximum angular acceleration magnitude [rad/s^2]."
      validation:
        gt<>: [0.0]

  weights:
    q:
      type: double_array
      default_value: [10.0, 10.0, 1.0]
      description: "Stage weights on the tracking error [x, y, yaw]."
      validation:
        fixed_size<>: 3
        lower_element_bounds<>: 0.0
    q_terminal:
      type: double_array
      default_value: [20.0, 20.0, 2.0]
      description: "Terminal weights on the tracking error [x, y, yaw]."
      validation:
        fixed_size<>: 3
        lower_element_bounds<>: 0.0
    r:
      type: double_array
      default_value: [0.5, 0.1]
      description: "Weights on the deviation from the feed-forward command [v, w]."
      validation:
        fixed_size<>: 2
        lower_element_bounds<>: 0.0
    r_delta:
      type: double_array
      default_value: [5.0, 1.0]
      description: "Weights on the command increments [dv, dw] (smoothness)."
      validation:
        fixed_size<>: 2
        lower_element_bounds<>: 0.0

  obstacles:
    enabled:
      type: bool
      default_value: true
      description: "Add soft half-plane obstacle constraints built from the local costmap."
    safety_distance:
      type: double
      default_value: 0.3
      description: "Minimum distance between the robot center and an obstacle cell center [m]."
      validation:
        gt_eq<>: [0.0]
    activation_distance:
      type: double
      default_value: 1.0
      description: "Obstacle cells farther than this from a predicted position are ignored [m]."
      validation:
        gt<>: [0.0]
    max_constraints_per_stage:
      type: int
      default_value: 2
      description: "Maximum number of half-planes per prediction step."
      validation:
        bounds<>: [0, 10]
    min_angle_separation:
      type: double
      default_value: 0.78
      description: "Minimum angle between the normals of two constraints of one step [rad]."
      validation:
        bounds<>: [0.0, 3.1416]
    escape_angle:
      type: double
      default_value: 0.78
      description: "Maximum angle between a constraint normal and the lateral direction [rad]; pi/2 = radial normals."
      validation:
        bounds<>: [0.0, 1.5708]
    violation_recovery_steps:
      type: int
      default_value: 5
      description: "Steps over which a constraint violated at the current position must be recovered."
      validation:
        gt_eq<>: [0]
    blocked_reference_weight:
      type: double
      default_value: 0.1
      description: "Scale of the tracking weights where the reference is closer than safety_distance to an obstacle."
      validation:
        bounds<>: [0.0, 1.0]
    slack_linear_weight:
      type: double
      default_value: 1000.0
      description: "L1 penalty on the constraint violation."
      validation:
        gt_eq<>: [0.0]
    slack_quadratic_weight:
      type: double
      default_value: 10000.0
      description: "Quadratic penalty on the constraint violation."
      validation:
        gt<>: [0.0]
    search_radius:
      type: double
      default_value: 2.0
      description: "Radius around the robot where lethal costmap cells are collected [m]."
      validation:
        gt<>: [0.0]
    voxel_size:
      type: double
      default_value: 0.1
      description: "Obstacle cells are downsampled to one per voxel_size x voxel_size square [m]."
      validation:
        gt_eq<>: [0.0]
    cost_threshold:
      type: int
      default_value: 254
      description: "Costmap cells with cost >= threshold are obstacles (254 = lethal)."
      validation:
        bounds<>: [1, 254]

  sqp:
    iterations:
      type: int
      default_value: 1
      description: "SQP iterations per cycle for nmpc_sqp (1 = Real-Time Iteration)."
      validation:
        bounds<>: [1, 20]
    tolerance:
      type: double
      default_value: 0.001
      description: "SQP stops when the max-norm of the command step is below this value."
      validation:
        gt<>: [0.0]
    linearization_min_speed:
      type: double
      default_value: 0.1
      description: "Minimum |v| of the SQP linearization point [m/s]."
      validation:
        gt_eq<>: [0.0]

  qp:
    max_iterations:
      type: int
      default_value: 4000
      description: "OSQP iteration limit."
      validation:
        gt<>: [0]
    eps_abs:
      type: double
      default_value: 0.0001
      description: "OSQP absolute tolerance."
      validation:
        gt<>: [0.0]
    eps_rel:
      type: double
      default_value: 0.0001
      description: "OSQP relative tolerance."
      validation:
        gt<>: [0.0]
    max_solve_time:
      type: double
      default_value: 0.025
      description: "Wall-clock budget of one QP solve [s]; exceeding it triggers the fallback."
      validation:
        gt<>: [0.0]
    max_consecutive_failures:
      type: int
      default_value: 3
      description: "Cycles in which the shifted previous solution is replayed after a solver failure."
      validation:
        gt_eq<>: [0]

  rotate_to_heading:
    enabled:
      type: bool
      default_value: true
      description: "Rotate in place when the heading error w.r.t. the path is large."
    start_angle:
      type: double
      default_value: 1.0
      description: "Heading error that starts an in-place rotation [rad]."
      validation:
        gt<>: [0.0]
    stop_angle:
      type: double
      default_value: 0.3
      description: "Heading error that ends the in-place rotation and hands over to the MPC [rad]."
      validation:
        gt<>: [0.0]
    gain:
      type: double
      default_value: 2.0
      description: "Proportional gain of the in-place rotation."
      validation:
        gt<>: [0.0]
    min_distance_to_goal:
      type: double
      default_value: 0.5
      description: "Closer than this to the goal the MPC handles the final approach and alignment itself [m]."
      validation:
        gt_eq<>: [0.0]

  collision_check:
    enabled:
      type: bool
      default_value: true
      description: "Check the predicted footprint against the local costmap before applying a command."
    max_time:
      type: double
      default_value: 1.0
      description: "Prediction time checked for collisions [s]."
      validation:
        gt_eq<>: [0.0]

  visualize:
    type: bool
    default_value: true
    description: "Publish the predicted/reference paths and the active constraints for RViz."
