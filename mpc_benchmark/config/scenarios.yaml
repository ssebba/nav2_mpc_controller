# Benchmark scenarios. `world` and `initial_pose` configure the simulation; `runner` and
# `recorder` are passed as parameters to the scenario_runner / metrics_recorder nodes.

s1_tracking:
  description: >-
    Open S-curve (6 m long, +-0.4 m, 3 m wavelength, minimum radius ~0.6 m) sent directly to
    the controller server (FollowPath action): pure tracking accuracy, no planner, no
    obstacles. The path must be open: goal-driven critics (e.g. DWB GoalDist) cannot follow a
    closed loop whose end coincides with the start.
  world: empty
  initial_pose: [0.0, 0.0, 0.0]
  runner:
    type: follow_path
    frame: odom      # robot starts at the odom origin: no localization noise in the metric
    path: {shape: sine, length: 6.0, size: 0.4, wavelength: 3.0, step: 0.05}
    timeout: 150.0
  recorder:
    path_frame: odom
    reference_path_topic: benchmark/reference_path
    scan_topic: ""

s2_waypoints:
  description: >-
    Five waypoints through the pillar grid of the TurtleBot3 world, full Nav2 stack
    (planner, behavior tree, AMCL).
  world: sandbox
  initial_pose: [-2.0, -0.5, 0.0]
  runner:
    type: navigate_through_poses
    frame: map
    waypoints: [0.55, -0.55, 0.0,
                2.0, 0.5, 1.57,
                0.55, 1.65, 3.14,
                -1.65, 0.55, -1.57,
                -0.55, -1.65, 0.0]
    timeout: 300.0
  recorder:
    path_frame: map

s3_unknown_obstacles:
  description: >-
    Straight 6 m route in an empty world with three boxes on it, not in the map. The global
    costmap has no obstacle layer, so the planner keeps drawing a straight line through the
    boxes: the local controller alone has to swerve around each of them.
  world: empty_obstacles
  initial_pose: [0.0, 0.0, 0.0]
  runner:
    type: navigate_through_poses
    frame: map
    waypoints: [6.0, 0.0, 0.0]
    timeout: 150.0
  # Trajectories from the simulator (wheel odometry drifts by 10-40 cm in the swerves).
  ground_truth: true
  recorder:
    # Fallback without ground truth: the robot starts at the odom origin (= world origin).
    path_frame: odom
  # Merged into the Nav2 parameters of this scenario only.
  nav2_overrides:
    global_costmap:
      global_costmap:
        ros__parameters:
          plugins: ["static_layer", "inflation_layer"]
    # An empty map gives AMCL nothing to match: its estimate random-walks (up to 1 m in 6 m),
    # moving the plan, hence the boxes relative to it, differently in every run. AMCL keeps
    # the initial pose instead (no filter updates), i.e. localization by odometry alone.
    amcl:
      ros__parameters:
        update_min_d: 1000.0
        update_min_a: 1000.0
