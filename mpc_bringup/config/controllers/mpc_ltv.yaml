# MPC (this repository): linear time-varying MPC, linearized on the reference.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mpc_controller::MpcController"
      solver: "ltv_mpc"
      horizon: 20
      dt: 0.1
      desired_linear_vel: 0.25
      limits: {v_min: -0.05, v_max: 0.26, w_max: 1.8, a_max: 1.0, alpha_max: 3.0}
      weights:
        q: [10.0, 10.0, 1.0]
        q_terminal: [20.0, 20.0, 2.0]
        r: [0.5, 0.1]
        r_delta: [5.0, 1.0]
      obstacles:
        enabled: true
        safety_distance: 0.3   # robot radius 0.22 m + 8 cm margin
        activation_distance: 1.0
        max_constraints_per_stage: 2
      sqp: {iterations: 1, linearization_min_speed: 0.1}
      qp: {max_solve_time: 0.025}
      rotate_to_heading: {enabled: true, start_angle: 1.0, stop_angle: 0.3}
      collision_check: {enabled: true, max_time: 1.0}
      visualize: true
